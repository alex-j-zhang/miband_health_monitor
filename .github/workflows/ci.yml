name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all first-party Python sources
        run: python -m compileall -q miband_monitor *.py tests tools

      - name: Code size budget (<=300 lines per first-party file)
        run: python tools/check_file_sizes.py

      - name: Privacy scan (no real device IDs/keys/paths in git)
        run: python tools/check_privacy.py

      - name: Documentation local-link check
        run: python tools/check_docs_links.py

      - name: Run unit/integration tests (no hardware)
        run: python -m pytest -q

      - name: Pure-Python ECDH backend smoke test
        env:
          MIBAND_ECDH_BACKEND: python
        run: python -c "import ecdh_wrapper as e; a=e.generate_ecdh_keys(); b=e.generate_ecdh_keys(); assert e.compute_shared_secret(a[0], b[1]) == e.compute_shared_secret(b[0], a[1]); print('ECDH backend:', e.backend_name())"

      - name: Demo smoke test (no hardware)
        run: python miband_client.py --demo 2 --imu --sync-history 1 --sync-sleep-spo2 --output data/ci-demo --storage both --export-csv

      - name: Verify demo artifacts
        shell: bash
        run: |
          test -s data/ci-demo/heart_rate.jsonl
          test -s data/ci-demo/steps.jsonl
          test -s data/ci-demo/imu.jsonl
          test -s data/ci-demo/spo2_sleep.jsonl
          test -s data/ci-demo/csv/heart_rate.csv
          test -s data/ci-demo/csv/spo2.csv
          test -s data/ci-demo/csv/spo2_sleep.csv
